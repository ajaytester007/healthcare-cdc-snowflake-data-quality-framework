name: Data Quality Test Reports

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with JUnit and Allure results
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit-results.xml --alluredir=reports/allure-results

      - name: Generate coverage reports
        run: |
          coverage run -m pytest -q
          coverage xml -o reports/coverage.xml
          coverage html -d reports/coverage_html
          coverage report | tee reports/coverage-summary.txt

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-cdc-dq-test-reports
          path: |
            reports/
